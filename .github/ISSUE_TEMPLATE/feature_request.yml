name: Feature request
description: Suggest an improvement or new feature for the bot.
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Describe the feature or workflow you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there existing alternatives or workarounds?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add screenshots, examples, or references if helpful.
